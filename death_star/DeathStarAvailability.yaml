groups:
- name: DeathStarAvailability
  rules:
  - alert: PrimaryWeaponDegraded
    expr: |
      sum(rate(istio_requests_total{reporter="destination", destination_service_name="superlaser", response_code~="5.."}[5m]))
      /
      sum(rate(istio_requests_total{reporter="destination", destination_service_name="superlaser"}[5m])) > 0.01
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Superlaser error rate > 1%"
      runbook: "docs/runbooks/reactor-instability.md"