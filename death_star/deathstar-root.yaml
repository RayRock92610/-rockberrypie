apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deathstar-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/empire/deathstar-resilient.git'
    targetRevision: HEAD
    path: ci/argo/applications # Points to the folder containing child apps
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true