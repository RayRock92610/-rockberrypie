apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superlaser-pipeline
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/empire/deathstar-resilient.git'
    targetRevision: HEAD
    path: environments/prod/us-east-1/superlaser # Kustomize overlay
  destination:
    name: prod-us-east-1-cluster
    namespace: weapon-systems
  syncPolicy:
    automated:
      prune: true